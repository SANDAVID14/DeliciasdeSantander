    function App() {
      // Estado de navegación
      const [view, setView] = useState("store");
      const [adminTab, setAdminTab] = useState("orders"); // Pestaña de pedidos por defecto
      const [selectedCategory, setSelectedCategory] = useState("todos");
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [fulfillment, setFulfillment] = useState("PICKUP");
      const [isCateringOpen, setIsCateringOpen] = useState(false);
      const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);

      // Estado de Sincronización Global
      const [syncStatus, setSyncStatus] = useState("loading"); // "connected", "offline", "syncing"
      const [syncMessage, setSyncMessage] = useState("Sincronizando catálogo y pedidos...");
      const [products, setProducts] = useState(() => {
        try {
          const saved = localStorage.getItem("dls_products_cache");
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {
          console.warn("Error leyendo dls_products_cache de localStorage", e);
        }
        return INITIAL_PRODUCTS;
      });
      const [banners, setBanners] = useState(() => {
        try {
          const saved = localStorage.getItem("dls_banners_cache");
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {
          console.warn("Error leyendo dls_banners_cache de localStorage", e);
        }
        return INITIAL_BANNERS;
      });
      const [currentBannerIndex, setCurrentBannerIndex] = useState(0);

      // ESTADO DE PEDIDOS (Persistencia en localStorage y hosting)
      const [orders, setOrders] = useState(() => {
        try {
          const saved = localStorage.getItem("dls_orders");
          if (saved) return JSON.parse(saved);
        } catch (e) {
          console.warn("Error leyendo dls_orders de localStorage", e);
        }
        return INITIAL_ORDERS;
      });

      // Filtros del gestor de pedidos
      const [orderFilterStatus, setOrderFilterStatus] = useState("all");
      const [orderFilterDate, setOrderFilterDate] = useState("");
      const [orderSearch, setOrderSearch] = useState("");

      // Modal Hoja de Producción de Cocina
      const [isProductionSheetOpen, setIsProductionSheetOpen] = useState(false);
      const [productionSheetDate, setProductionSheetDate] = useState(new Date().toISOString().split("T")[0]);

      // Estado de Sincronización con GitHub desde Móvil / Cualquier Navegador
      const [githubToken, setGithubToken] = useState(() => {
        return localStorage.getItem("dls_github_token") || "";
      });
      const [githubRepo, setGithubRepo] = useState(() => {
        return localStorage.getItem("dls_github_repo") || "SANDAVID14/DeliciasdeSantander";
      });
      const [isGitHubModalOpen, setIsGitHubModalOpen] = useState(false);
      const [isSyncingGitHub, setIsSyncingGitHub] = useState(false);
      const [testGhResult, setTestGhResult] = useState(null);
      const [isTestingGh, setIsTestingGh] = useState(false);

      const handleTestGitHubConnection = async () => {
        if (!githubToken.trim()) {
          setTestGhResult({ success: false, message: "⚠️ Ingrese un Personal Access Token antes de probar." });
          return;
        }
        setIsTestingGh(true);
        setTestGhResult(null);
        try {
          const res = await fetch(`https://api.github.com/repos/${githubRepo.trim()}`, {
            headers: {
              "Authorization": `Bearer ${githubToken.trim()}`,
              "Accept": "application/vnd.github+json"
            }
          });
          if (res.ok) {
            const data = await res.json();
            const canPush = data.permissions && data.permissions.push;
            if (canPush) {
              setTestGhResult({ success: true, message: `✅ ¡Conectado a ${data.full_name}! Permisos de escritura (push) confirmados.` });
            } else {
              setTestGhResult({ success: false, message: `⚠️ Conectado a ${data.full_name}, pero el token no tiene permisos de escritura (repo).` });
            }
          } else {
            const err = await res.json().catch(() => ({}));
            setTestGhResult({ success: false, message: `❌ Error (${res.status}): ${err.message || "Token inválido o sin acceso"}` });
          }
        } catch (e) {
          setTestGhResult({ success: false, message: `❌ Error de conexión: ${e.message}` });
        } finally {
          setIsTestingGh(false);
        }
      };

      // Cargar datos CENTRALIZADOS desde el hosting / API al iniciar la web
      useEffect(() => {
        async function fetchGlobalStoreData() {
          try {
            setSyncStatus("syncing");
            setSyncMessage("Cargando catálogo actualizado...");

            const isLocal = window.location.hostname === "localhost" || 
                            window.location.hostname === "127.0.0.1" || 
                            window.location.hostname.startsWith("192.168.");

            // Priorizamos la fuente directa más rápida y actualizada según el entorno
            const endpoints = isLocal
              ? [
                  "./api/sync?t=" + Date.now(),
                  "./data/store.json?t=" + Date.now(),
                  "https://raw.githubusercontent.com/SANDAVID14/DeliciasdeSantander/master/data/store.json?t=" + Date.now()
                ]
              : [
                  "https://raw.githubusercontent.com/SANDAVID14/DeliciasdeSantander/master/data/store.json?t=" + Date.now(),
                  "./data/store.json?t=" + Date.now(),
                  "./api/sync?t=" + Date.now()
                ];

            let bestData = null;

            for (const ep of endpoints) {
              try {
                const res = await fetch(ep, { cache: "no-store" });
                if (res.ok) {
                  const json = await res.json();
                  if (json && (Array.isArray(json.products) || Array.isArray(json.banners))) {
                    if (!bestData || (json.updatedAt && (!bestData.updatedAt || new Date(json.updatedAt) > new Date(bestData.updatedAt)))) {
                      bestData = json;
                    }
                  }
                }
              } catch (e) {
                // Siguiente endpoint
              }
            }

            if (bestData) {
              const localUpdatedAt = localStorage.getItem("dls_updated_at");
              const remoteUpdatedAt = bestData.updatedAt;

              // Comprobar si las modificaciones locales son más recientes que el archivo remoto
              const hasLocalModifications = localUpdatedAt && remoteUpdatedAt && new Date(localUpdatedAt) > new Date(remoteUpdatedAt);

              if (hasLocalModifications) {
                console.info("Modificaciones locales detectadas más recientes que el servidor. Conservando y sincronizando...");
                const cachedProds = localStorage.getItem("dls_products_cache");
                const cachedBans = localStorage.getItem("dls_banners_cache");
                const cachedOrders = localStorage.getItem("dls_orders");

                const prods = cachedProds ? JSON.parse(cachedProds) : products;
                const bans = cachedBans ? JSON.parse(cachedBans) : banners;
                const ords = cachedOrders ? JSON.parse(cachedOrders) : orders;

                setProducts(prods);
                setBanners(bans);
                setOrders(ords);

                setSyncStatus("connected");
                setSyncMessage("🟢 Conectado (Sincronizando cambios locales...)");

                // Sincronizar automáticamente hacia el servidor / GitHub
                saveToHosting(prods, bans, ords);
              } else {
                // El servidor es más reciente o no hay modificaciones locales previas
                if (bestData.products && Array.isArray(bestData.products)) {
                  setProducts(bestData.products);
                  localStorage.setItem("dls_products_cache", JSON.stringify(bestData.products));
                }
                if (bestData.banners && Array.isArray(bestData.banners)) {
                  setBanners(bestData.banners);
                  localStorage.setItem("dls_banners_cache", JSON.stringify(bestData.banners));
                }
                if (bestData.orders && Array.isArray(bestData.orders) && bestData.orders.length > 0) {
                  setOrders(bestData.orders);
                  localStorage.setItem("dls_orders", JSON.stringify(bestData.orders));
                }
                if (remoteUpdatedAt) {
                  localStorage.setItem("dls_updated_at", remoteUpdatedAt);
                }
                setSyncStatus("connected");
                setSyncMessage("🟢 Conectado en vivo (Catálogo oficial actualizado)");
              }
            } else {
              fallbackToCache();
            }
          } catch (err) {
            console.warn("No se pudo conectar con el endpoint del hosting, usando datos locales:", err);
            fallbackToCache();
          }
        }

        function fallbackToCache() {
          const cachedProds = localStorage.getItem("dls_products_cache");
          const cachedBans = localStorage.getItem("dls_banners_cache");
          const cachedOrders = localStorage.getItem("dls_orders");
          if (cachedProds) setProducts(JSON.parse(cachedProds));
          if (cachedBans) setBanners(JSON.parse(cachedBans));
          if (cachedOrders) setOrders(JSON.parse(cachedOrders));
          setSyncStatus("connected");
          setSyncMessage("🟢 Modo Autónomo (Datos guardados localmente)");
        }

        fetchGlobalStoreData();

        // Actualización al enfocar la pestaña y sondeo periódico cada 45 segundos
        const onFocus = () => fetchGlobalStoreData();
        window.addEventListener("focus", onFocus);
        const pollTimer = setInterval(fetchGlobalStoreData, 45000);

        return () => {
          window.removeEventListener("focus", onFocus);
          clearInterval(pollTimer);
        };
      }, []);

      // Auto-rotación de banners promocionales cada 6 segundos
      useEffect(() => {
        if (banners.length <= 1) return;
        const timer = setInterval(() => {
          setCurrentBannerIndex(prev => (prev + 1) % banners.length);
        }, 6000);
        return () => clearInterval(timer);
      }, [banners.length]);

      // SINCRONIZACIÓN DIRECTA CON GITHUB VÍA REST API (Funciona desde cualquier celular / navegador en el mundo)
      const syncDirectToGitHub = async (prods, bans, ords, customToken = null) => {
        const token = customToken || githubToken || localStorage.getItem("dls_github_token");
        const repo = githubRepo || localStorage.getItem("dls_github_repo") || "SANDAVID14/DeliciasdeSantander";
        if (!token) return { success: false, reason: "no_token" };

        setIsSyncingGitHub(true);
        try {
          const path = "data/store.json";
          const apiUrl = `https://api.github.com/repos/${repo}/contents/${path}`;

          // 1. Obtener SHA actual del archivo en GitHub
          let sha = null;
          try {
            const getRes = await fetch(apiUrl + "?t=" + Date.now(), {
              headers: {
                "Authorization": `Bearer ${token}`,
                "Accept": "application/vnd.github+json"
              }
            });
            if (getRes.ok) {
              const getJson = await getRes.json();
              sha = getJson.sha;
            }
          } catch (e) {
            console.warn("No se pudo obtener SHA previo de GitHub:", e);
          }

          const payload = {
            updatedAt: new Date().toISOString(),
            products: prods !== undefined ? prods : products,
            banners: bans !== undefined ? bans : banners,
            orders: ords !== undefined ? ords : orders
          };

          const jsonStr = JSON.stringify(payload, null, 2);
          const base64Content = btoa(unescape(encodeURIComponent(jsonStr)));

          const nowHuman = new Date().toLocaleString("es-ES", { dateStyle: "short", timeStyle: "medium" });
          const putBody = {
            message: `feat(admin): actualizacion desde panel movil/web (${nowHuman})`,
            content: base64Content,
            branch: "master"
          };
          if (sha) putBody.sha = sha;

          const putRes = await fetch(apiUrl, {
            method: "PUT",
            headers: {
              "Authorization": `Bearer ${token}`,
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json"
            },
            body: JSON.stringify(putBody)
          });

          if (putRes.ok) {
            const putData = await putRes.json();
            setIsSyncingGitHub(false);
            return { success: true, commit: putData.commit };
          } else {
            const errData = await putRes.json().catch(() => ({}));
            setIsSyncingGitHub(false);
            return { success: false, error: errData.message || "Error al subir a GitHub" };
          }
        } catch (err) {
          setIsSyncingGitHub(false);
          return { success: false, error: err.message };
        }
      };

      // FUNCIÓN MAESTRA: Sube y actualiza los cambios en el HOSTING y en GITHUB en tiempo real
      const saveToHosting = async (updatedProducts, updatedBanners, updatedOrders) => {
        setSyncStatus("syncing");
        setSyncMessage("⏳ Publicando cambios en servidor y GitHub...");

        const prods = updatedProducts !== undefined ? updatedProducts : products;
        const bans = updatedBanners !== undefined ? updatedBanners : banners;
        const ords = updatedOrders !== undefined ? updatedOrders : orders;
        const nowIso = new Date().toISOString();

        // 1. Guardar INMEDIATAMENTE en caché del navegador actual
        localStorage.setItem("dls_products_cache", JSON.stringify(prods));
        localStorage.setItem("dls_banners_cache", JSON.stringify(bans));
        localStorage.setItem("dls_orders", JSON.stringify(ords));
        localStorage.setItem("dls_updated_at", nowIso);

        const payload = {
          token: "Santander2026*", // Token de seguridad verificado en backend
          updatedAt: nowIso,
          products: prods,
          banners: bans,
          orders: ords
        };

        // Probar endpoints de sincronización disponibles
        const endpoints = [API_ENDPOINT, "./api/sync", "./api/sync.php", "/api/sync", "/api/sync.php"];
        let success = false;
        let ghSyncedFromBackend = false;

        for (const ep of endpoints) {
          try {
            const res = await fetch(ep, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });
            if (res.ok) {
              const resData = await res.json().catch(() => ({}));
              success = true;
              if (resData.githubSynced) {
                ghSyncedFromBackend = true;
              }
              break;
            }
          } catch (e) {
            // probar siguiente endpoint
          }
        }

        // Si hay token de GitHub configurado en el navegador móvil y el backend no lo empujó
        let directGhSuccess = false;
        const currentGhToken = localStorage.getItem("dls_github_token");
        if (currentGhToken && !ghSyncedFromBackend) {
          const ghRes = await syncDirectToGitHub(prods, bans, ords, currentGhToken);
          if (ghRes.success) {
            directGhSuccess = true;
            success = true;
          }
        }

        if (ghSyncedFromBackend || directGhSuccess) {
          setSyncStatus("connected");
          setSyncMessage("🚀 ¡Publicado en GitHub y actualizado para todos los clientes!");
        } else if (success) {
          setSyncStatus("connected");
          setSyncMessage("✅ ¡Cambios guardados en servidor y publicados!");
        } else {
          setSyncStatus("offline");
          setSyncMessage("💾 Cambios guardados localmente en este dispositivo");
          const isLocal = window.location.hostname === "localhost" || 
                          window.location.hostname === "127.0.0.1" || 
                          window.location.hostname.startsWith("192.168.");
          if (!isLocal && !currentGhToken) {
            setIsGitHubModalOpen(true);
          }

      };

      // Estado de Checkout con método de pago
      const [customerData, setCustomerData] = useState({
        name: "",
        phone: "",
        address: "",
        postalCode: "46001",
        date: new Date(Date.now() + 86400000).toISOString().split("T")[0],

      // Estado de login admin con persistencia en sessionStorage
      const [isAdminLogged, setIsAdminLogged] = useState(() => {

      const [adminCreds, setAdminCreds] = useState({ user: "", pass: "" });
      const [loginError, setLoginError] = useState("");

      // Editor modal de Producto (Crear / Editar)
      const [editingProduct, setEditingProduct] = useState(null);

        name: "",

        id: "",

        badge: "",
        btnText: "",
        btnLink: "",

      const subtotal = useMemo(() => {
        return cart.reduce((acc, item) => {

          return acc + (actualPrice * item.quantity);

      const selectedDayName = useMemo(() => {
        return getDayNameFromDate(customerData.date);

      const dateConflictItems = useMemo(() => {
        if (!customerData.date || cart.length === 0) return [];
        const day = getDayNameFromDate(customerData.date);
        return cart.filter(item => {
          if (day === "Lunes") return true; // El obrador descansa los lunes
          if (!item.availableDays || item.availableDays.length === 0) return false;
          return !item.availableDays.includes(day);

      const addToCart = (product) => {
        const actualPrice = product.isPromo && product.promoPrice ? product.promoPrice : product.price;
        setCart(prev => {
          const exists = prev.find(i => i.id === product.id);
          if (exists) {
            return prev.map(i => i.id === product.id ? { ...i, quantity: i.quantity + 1 } : i);

          return [...prev, { ...product, activePrice: actualPrice, quantity: 1 }];
        });
        setIsCartOpen(true);

      const updateQty = (id, delta) => {
        setCart(prev => prev.map(item => {
          if (item.id === id) {

          return item;

      const notifyCustomerWhatsApp = (order) => {
        let cleanPhone = (order.customer.phone || "").replace(/[^0-9]/g, "");

        let text = "";

          text = `Hola ${order.customer.name}, te escribimos de *Delicias de Santander VLC* respecto a tu pedido *${order.ref}*. Por favor contáctanos para coordinar cualquier detalle.`;
        } else {
          text = `Hola ${order.customer.name}, te escribimos desde el obrador de *Delicias de Santander VLC* respecto a tu encargo *${order.ref}*.`;
        }

        window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(text)}`, "_blank");
      };

      // Consolidado de Producción para Cocina
      const productionSummary = useMemo(() => {
        const targetDate = productionSheetDate || new Date().toISOString().split("T")[0];
        const dayOrders = orders.filter(o => o.deliveryDate === targetDate && o.status !== "Cancelado");

        const itemMap = {};
        const notesList = [];

        dayOrders.forEach(ord => {
          if (ord.notes) {
            notesList.push({ ref: ord.ref, customer: ord.customer.name, notes: ord.notes, timeSlot: ord.timeSlot });
          }
          ord.items.forEach(item => {
            if (!itemMap[item.name]) {
              itemMap[item.name] = {
                name: item.name,
                category: item.category,
                totalQty: 0,
                bySlot: {
                  "12:00 - 14:00": 0,
                  "14:00 - 16:00": 0,
                  "18:30 - 20:30": 0
                }
              };

            itemMap[item.name].totalQty += item.quantity;
            if (itemMap[item.name].bySlot[ord.timeSlot] !== undefined) {
              itemMap[item.name].bySlot[ord.timeSlot] += item.quantity;
            } else {
              itemMap[item.name].bySlot[ord.timeSlot] = item.quantity;

        return {

          dayName: getDayNameFromDate(targetDate),
          totalOrders: dayOrders.length,
          items: Object.values(itemMap),

        };
      }, [orders, productionSheetDate]);

      // Login Admin Handler
      const handleAdminLogin = (e) => {

        if (adminCreds.user === "admin" && adminCreds.pass === "Santander2026*") {
          setIsAdminLogged(true);

      // Abrir editor de producto

            prepTime: "24h",
            availableDays: ["Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"],
            description: "",
            allergens: "",
            ingredients: "",
            imageUrl: ""

      // Guardar Producto y SINCRONIZAR AL HOSTING
      const handleSaveProduct = async (e) => {

          ? productFormData.allergens
          : (typeof productFormData.allergens === "string"

        };

        setEditingProduct(null);

        // Envío directo al hosting
        await saveToHosting(newProductsList, banners, orders);
      };

      const handleDeleteProduct = async (id) => {
        if (confirm("¿Estás seguro de que deseas eliminar este producto de la web oficial?")) {

          });

            </div>

            <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">

                  </div>

                  {/* Resumen de Producción */}
                  {productionSummary.items.length === 0 ? (
                    <div className="py-8 text-center text-stone-400 text-sm">
                      No hay pedidos programados para preparar en la fecha seleccionada ({productionSummary.targetDate}).
                    </div>
                  ) : (
                    <div className="space-y-6">
                      <div>
                        <h4 className="text-xs font-black uppercase text-stone-700 tracking-wider mb-2">
                          1. Consolidado Total de Platos a Cocinar
                        </h4>
                        <table className="w-full text-left text-xs border border-stone-200">
                          <thead className="bg-stone-100 text-stone-700 uppercase font-bold text-[10px] border-b">
                            <tr>
                              <th className="p-2.5">Plato / Elaboración</th>
                              <th className="p-2.5 text-center font-black bg-stone-200">TOTAL UNIDADES</th>
                              <th className="p-2.5 text-center">12:00 - 14:00 (Almuerzo)</th>
                              <th className="p-2.5 text-center">14:00 - 16:00 (Tarde)</th>
                              <th className="p-2.5 text-center">18:30 - 20:30 (Cena)</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-stone-200 font-medium">
                            {productionSummary.items.map((item, idx) => (
                              <tr key={idx} className="hover:bg-stone-50">
                                <td className="p-2.5 font-bold text-stone-900 text-sm">
                                  {item.name}
                                </td>
                                <td className="p-2.5 text-center font-black text-base text-brand-red bg-amber-50">
                                  {item.totalQty}
                                </td>
                                <td className="p-2.5 text-center text-stone-700 font-semibold">
                                  {item.bySlot["12:00 - 14:00"] || "-"}
                                </td>
                                <td className="p-2.5 text-center text-stone-700 font-semibold">
                                  {item.bySlot["14:00 - 16:00"] || "-"}
                                </td>
                                <td className="p-2.5 text-center text-stone-700 font-semibold">
                                  {item.bySlot["18:30 - 20:30"] || "-"}
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>

                      {/* Alérgenos y Notas especiales */}
                      {productionSummary.notes.length > 0 && (
                        <div className="border border-amber-300 bg-amber-50/50 rounded-xl p-4">
                          <h4 className="text-xs font-black uppercase text-amber-900 tracking-wider mb-2">
                            ⚠️ 2. Instrucciones Especiales & Alergias para Cocina
                          </h4>
                          <div className="space-y-1.5 text-xs">
                            {productionSummary.notes.map((n, idx) => (
                              <div key={idx} className="flex items-start gap-2 text-stone-800">
                                <span className="font-mono font-bold text-brand-red">[{n.ref} - {n.timeSlot}]:</span>
                                <span><b>{n.customer}:</b> "{n.notes}"</span>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      <div className="text-[10px] text-stone-400 pt-3 border-t flex justify-between">
                        <span>Generado desde Panel de Control de Delicias de Santander VLC</span>
                        <span>Firma Responsable de Obrador: _______________________</span>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* MODAL CATERING Y EVENTOS */}
          {isCateringOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
              <div className="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center mb-4 pb-2 border-b">
                  <div>
                    <h3 className="font-bold text-lg text-stone-900">Catering & Eventos Especiales</h3>
                    <p className="text-xs text-stone-500 font-cursive text-base">"Llevamos el obrador y la fiesta santandereana a tu celebración"</p>
                  </div>
                  <button onClick={() => setIsCateringOpen(false)} className="text-stone-400 hover:text-black">✕</button>
                </div>

                <div className="space-y-4 text-xs text-stone-700">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div className="p-4 border border-orange-200 bg-orange-50/50 rounded-xl">
                      <h4 className="font-bold text-sm text-brand-red mb-1">🎉 Banquete Típico Completo</h4>
                      <p className="text-stone-600 text-[11px] leading-relaxed mb-2">
                        Cazuelas de Mute al fogón, Carne Oreada al carbón en vivo, arepas de maíz pelao ilimitadas y degustación de postres veleños.
                      </p>
                      <span className="font-bold text-stone-900">Desde 18,50 € / persona</span>
                    </div>

                    <div className="p-4 border border-amber-200 bg-amber-50/50 rounded-xl">
                      <h4 className="font-bold text-sm text-amber-900 mb-1">🥟 Estación de Pasabocas & Coctel</h4>
                      <p className="text-stone-600 text-[11px] leading-relaxed mb-2">
                        Bandejas de mini empanadas santandereanas, pinchos de carne oreada, mini arepas con queso y rondas de masato frío.
                      </p>
                      <span className="font-bold text-stone-900">Desde 12,00 € / persona</span>
                    </div>
                  </div>

                  <div className="p-4 bg-stone-100 rounded-xl">
                    <h4 className="font-bold text-stone-900 mb-2">Solicitar Presupuesto Personalizado</h4>
                    <p className="mb-3 text-[11px] text-stone-600">
                      Indícanos la fecha, número de personas y tipo de evento. Te responderemos directamente con disponibilidad y cotización formal.
                    </p>
                    <a 
                      href="https://wa.me/34603374784?text=Hola%2C%20quisiera%20solicitar%20un%20presupuesto%20para%20un%20evento%20o%20catering%20con%20Delicias%20de%20Santander%20VLC." 
                      target="_blank"
                      className="inline-flex items-center gap-2 px-4 py-2.5 bg-green-600 text-white rounded-lg font-bold text-xs hover:bg-green-700 shadow-sm">
                      <span>📲 Cotizar Catering por WhatsApp</span>
                    </a>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MODAL CONFIGURACIÓN DE GITHUB API */}
          {isGitHubModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-4 pb-2 border-b">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">🐙</span>
                    <h3 className="font-bold text-base text-stone-900">Sincronización con GitHub Móvil</h3>
                  </div>
                  <button onClick={() => setIsGitHubModalOpen(false)} className="text-stone-400 hover:text-black font-bold">✕</button>
                </div>

                <p className="text-xs text-stone-600 mb-4 leading-relaxed">
                  Permite que las modificaciones hechas desde cualquier celular o navegador se guarden directamente en tu repositorio de GitHub (<b>{githubRepo}</b>) mediante la API oficial de GitHub.
                </p>

                <div className="space-y-3 text-xs mb-5">
                  <div>
                    <label className="block font-bold text-stone-700 mb-1">Repositorio de GitHub</label>
                    <input 
                      type="text" 
                      value={githubRepo} 
                      onChange={e => {
                        setGithubRepo(e.target.value);
                        localStorage.setItem("dls_github_repo", e.target.value);
                      }} 
                      className="w-full px-3 py-2 border rounded-lg font-mono text-xs" 
                      placeholder="usuario/repositorio"
                    />
                  </div>
                  <div>
                    <div className="flex items-center justify-between mb-1">
                      <label className="block font-bold text-stone-700">Personal Access Token de GitHub (PAT)</label>
                      <a 
                        href="https://github.com/settings/tokens/new?scopes=repo&description=Delicias+de+Santander+Admin" 
                        target="_blank" 
                        rel="noopener noreferrer"
                        className="text-brand-red font-semibold underline text-[11px] hover:text-brand-darkRed flex items-center gap-1">
                        🔑 Crear token en GitHub ↗
                      </a>
                    </div>
                    <input 
                      type="password" 
                      value={githubToken} 
                      onChange={e => setGithubToken(e.target.value)} 
                      className="w-full px-3 py-2 border rounded-lg font-mono text-xs focus:ring-2 focus:ring-brand-red focus:outline-none" 
                      placeholder="github_pat_... o ghp_..."
                    />
                    <span className="text-[10px] text-stone-500 mt-1 block">
                      Se almacena únicamente en este dispositivo (localStorage). Solo requiere permiso de <b>repo</b> o <b>Contents: read & write</b>.
                    </span>
                  </div>

                  {/* RESULTADO DE LA PRUEBA */}
                  {testGhResult && (
                    <div className={`p-2.5 rounded-lg text-xs font-semibold ${testGhResult.success ? "bg-green-50 text-green-800 border border-green-200" : "bg-red-50 text-red-800 border border-red-200"}`}>
                      {testGhResult.message}
                    </div>
                  )}
                </div>

                <div className="flex items-center justify-between gap-2 pt-2 border-t">
                  <button 
                    onClick={handleTestGitHubConnection}
                    disabled={isTestingGh}
                    className="px-3 py-2 bg-stone-100 hover:bg-stone-200 text-stone-800 rounded-lg font-bold text-xs border flex items-center gap-1 transition-all">
                    <span>{isTestingGh ? "⏳ Probando..." : "🔍 Probar Conexión"}</span>
                  </button>
                  <div className="flex gap-2">
                    <button 
                      onClick={() => setIsGitHubModalOpen(false)} 
                      className="px-3.5 py-2 border rounded-lg font-bold text-xs text-stone-600 hover:bg-stone-50">
                      Cerrar
                    </button>
                    <button 
                      onClick={() => {
                        localStorage.setItem("dls_github_token", githubToken.trim());
                        localStorage.setItem("dls_github_repo", githubRepo.trim());
                        setIsGitHubModalOpen(false);
                        alert("✅ Configuración de GitHub guardada exitosamente en este dispositivo.");
                      }} 
                      className="px-4 py-2 bg-brand-red text-white rounded-lg font-bold text-xs hover:bg-brand-darkRed shadow-md active:scale-95 transition-all">
                      Guardar y Conectar
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* BOTÓN FLOTANTE DE ASISTENCIA Y PEDIDOS POR WHATSAPP */}
          <a
            href="https://wa.me/34603374784?text=Hola%20Delicias%20de%20Santander%20VLC%2C%20quisiera%20hacer%20una%20consulta%20o%20encargar%20un%20pedido."
            target="_blank"
            rel="noopener noreferrer"
            className="fixed bottom-6 right-6 z-40 flex items-center gap-2.5 px-4 py-3 bg-[#25D366] text-white rounded-full shadow-2xl hover:bg-[#20ba59] hover:scale-105 active:scale-95 transition-all duration-200 group border-2 border-white/80"
            title="Pedir o consultar por WhatsApp"
          >
            <span className="text-xl">💬</span>
            <span className="font-extrabold text-xs sm:text-sm tracking-wide hidden sm:inline-block">
              ¿Preguntas o Encargos? Escríbenos
            </span>
            <span className="font-extrabold text-xs sm:hidden">WhatsApp</span>
            <span className="relative flex h-2.5 w-2.5">
              <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-white opacity-75"></span>
              <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-white"></span>
            </span>
          </a>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
